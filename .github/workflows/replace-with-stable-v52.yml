name: Replace repository with stable v5.2

on:
  push:
    paths:
      - .github/workflows/replace-with-stable-v52.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified stable v5.2 project
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-replace/part_*.b64 | base64 -d > /tmp/stable-v5.2.tar.xz
          echo "1e534df005bd62337f3de8062ec64846d69f3a9a218d54d1c27ef6d49f0a7fed  /tmp/stable-v5.2.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/stable-v5.2.tar.xz -C .
          test -f project.sproject
          test -f levels/rookietown_rom.tmx
          test -f README.md
          test -f STABLE_BASELINE.md

      - name: Commit clean stable baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace repository with stable v5.2 Scorpion baseline"
          git push origin HEAD:main
